<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitBuddy AI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7f5;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #1f7a4d;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        select,
        input,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #1f7a4d;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #165c39;
        }

        .section {
            margin-top: 30px;
            padding: 20px;
            background: #f0f8f3;
            border-radius: 12px;
        }

        .section h2 {
            color: #1f7a4d;
            margin-bottom: 15px;
        }

        #workoutList,
        #nutritionList {
            padding-left: 20px;
        }

        li {
            margin-bottom: 10px;
        }

        #result {
            display: none;
        }

        #feedbackMessage {
            margin-top: 15px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🏋️ FitBuddy AI</h1>

    <p class="subtitle">
        Your Personal AI Fitness Plan Generator
    </p>

    <!-- WORKOUT -->
    <label for="goal">Goal</label>

    <select id="goal">
        <option value="weight loss">Weight Loss</option>
        <option value="muscle gain">Muscle Gain</option>
        <option value="general fitness">General Fitness</option>
    </select>

    <label for="level">Fitness Level</label>

    <select id="level">
        <option value="beginner">Beginner</option>
        <option value="intermediate">Intermediate</option>
        <option value="advanced">Advanced</option>
    </select>

    <label for="days">Days Per Week</label>

    <input type="number" id="days" min="1" max="7" value="4">

    <button onclick="generateWorkout()">
        Generate Workout
    </button>

    <div id="result" class="section">

        <h2>Your Workout Plan</h2>

        <ul id="workoutList"></ul>

    </div>


    <!-- NUTRITION -->
    <div class="section">

        <h2>🥗 Nutrition Tips</h2>

        <button onclick="getNutrition()">
            Show Nutrition Tips
        </button>

        <ul id="nutritionList"></ul>

    </div>


    <!-- FEEDBACK -->
    <div class="section">

        <h2>⭐ Give Your Feedback</h2>

        <label for="name">Name</label>

        <input
            type="text"
            id="name"
            placeholder="Enter your name"
        >

        <label for="rating">Rating</label>

        <select id="rating">
            <option value="5">⭐⭐⭐⭐⭐</option>
            <option value="4">⭐⭐⭐⭐</option>
            <option value="3">⭐⭐⭐</option>
            <option value="2">⭐⭐</option>
            <option value="1">⭐</option>
        </select>

        <label for="message">Feedback</label>

        <textarea
            id="message"
            placeholder="Enter your feedback"
        ></textarea>

        <button onclick="submitFeedback()">
            Submit Feedback
        </button>

        <p id="feedbackMessage"></p>

    </div>

</div>


<script>

async function generateWorkout() {

    const goal = document.getElementById("goal").value;
    const level = document.getElementById("level").value;
    const days = Number(document.getElementById("days").value);

    try {

        const response = await fetch("/workout", {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                goal: goal,
                level: level,
                days_per_week: days
            })
        });

        const data = await response.json();

        const workoutList =
            document.getElementById("workoutList");

        workoutList.innerHTML = "";

        data.workout_plan.forEach(function(workout) {

            const li = document.createElement("li");

            li.textContent = workout;

            workoutList.appendChild(li);

        });

        document.getElementById("result").style.display = "block";

    } catch (error) {

        alert("Unable to connect to FitBuddy AI.");

    }
}


async function getNutrition() {

    try {

        const response = await fetch("/nutrition");

        const data = await response.json();

        const nutritionList =
            document.getElementById("nutritionList");

        nutritionList.innerHTML = "";

        data.tips.forEach(function(tip) {

            const li = document.createElement("li");

            li.textContent = tip;

            nutritionList.appendChild(li);

        });

    } catch (error) {

        alert("Unable to load nutrition tips.");

    }
}


async function submitFeedback() {

    const name =
        document.getElementById("name").value;

    const rating =
        Number(document.getElementById("rating").value);

    const message =
        document.getElementById("message").value;

    if (!name || !message) {

        alert("Please enter your name and feedback.");

        return;
    }

    try {

        const response = await fetch("/feedback", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                name: name,
                rating: rating,
                message: message
            })

        });

        const data = await response.json();

        document.getElementById("feedbackMessage")
            .textContent = data.message;

        document.getElementById("name").value = "";
        document.getElementById("message").value = "";

    } catch (error) {

        alert("Unable to submit feedback.");

    }
}

</script>

</body>
</html>
